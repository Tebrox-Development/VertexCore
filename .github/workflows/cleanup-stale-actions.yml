name: Cleanup stale Actions

on:
  push:
    branches: [development]

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Cancel superseded workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Cancel older active runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          queued="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f status=queued -f per_page=100)"
          running="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs" -f status=in_progress -f per_page=100)"

          jq -s '[.[0].workflow_runs[], .[1].workflow_runs[]]' \
            <(printf '%s' "$queued") \
            <(printf '%s' "$running") \
          | jq -r '
              group_by([.name, .head_branch, .event])[]
              | sort_by(.created_at)
              | reverse
              | .[1:][]
              | [.id, .name, .head_branch, .head_sha, .status]
              | @tsv
            ' \
          | while IFS=$'\t' read -r run_id workflow branch sha status; do
              if [[ "$run_id" == "$GITHUB_RUN_ID" ]]; then
                continue
              fi

              echo "Cancelling stale run $run_id: $workflow / $branch / $sha / $status"
              gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null || true
            done
