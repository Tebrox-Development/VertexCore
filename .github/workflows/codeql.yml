name: CodeQL

on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  changes:
    name: Classify CodeQL changes
    if: github.event_name != 'push'
    runs-on: [self-hosted, Linux, X64, vertexcore]
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_ACTION}" != "synchronize" || -z "${BEFORE_SHA:-}" ]]; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > /tmp/changed-files
          cat /tmp/changed-files

          if grep -Eq '^((src/)|(pom\.xml$)|(\.github/workflows/codeql\.yml$))' /tmp/changed-files; then
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
          else
            echo "relevant=false" >> "${GITHUB_OUTPUT}"
          fi

  analyze:
    name: Java CodeQL
    needs: changes
    if: always() && (github.event_name == 'push' || needs.changes.outputs.relevant == 'true')
    runs-on: [self-hosted, Linux, X64, vertexcore, resource-heavy]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin

      - name: Build
        run: mvn -B -ntp -DskipTests package

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
