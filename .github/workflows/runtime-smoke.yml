name: Paper 26.3 Preview Compatibility

on:
  push:
    branches: [test/paper-26.3-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paper-26.3-preview-compat
  cancel-in-progress: true

jobs:
  runtime-smoke:
    name: VertexCore 1.1.1 / Paper 26.3 / Java 25
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20

    steps:
      - name: Checkout test harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'

      - name: Download and verify released VertexCore 1.1.1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-under-test
          BASE_URL="https://github.com/Tebrox-Development/VertexCore/releases/download/v1.1.1"
          curl --fail --silent --show-error --location \
            "${BASE_URL}/vertexCore-1.1.1.jar" \
            --output target/release-under-test/vertexCore-1.1.1.jar
          curl --fail --silent --show-error --location \
            "${BASE_URL}/vertexCore-1.1.1.jar.sha256" \
            --output target/release-under-test/vertexCore-1.1.1.jar.sha256
          (
            cd target/release-under-test
            sha256sum -c vertexCore-1.1.1.jar.sha256
          )

      - name: Runtime smoke
        env:
          PAPER_VERSION: '26.3'
          PAPER_BUILD: 'latest-available'
          PAPER_ALLOW_PRERELEASE: 'true'
          SERVER_READY_TIMEOUT_SECONDS: '300'
          PLUGIN_JAR: ${{ github.workspace }}/target/release-under-test/vertexCore-1.1.1.jar
        run: bash scripts/runtime-smoke.sh
