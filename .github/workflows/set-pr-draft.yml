name: Set PR to Draft

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number
        required: true
        type: number

permissions:
  contents: read

jobs:
  set-draft:
    name: Set PR to draft
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5

    steps:
      - name: Set PR to draft
        env:
          GH_TOKEN: ${{ secrets.VERTEXCORE_READY_FOR_REVIEW_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error title=Missing repository secret::VERTEXCORE_READY_FOR_REVIEW_TOKEN is not configured"
            exit 1
          fi

          gh pr ready "$PR_NUMBER" --undo --repo "$GH_REPO"
