name: Retag VertexCore 1.1.1

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/retag-v1.1.1.yml

permissions:
  contents: write

jobs:
  retag:
    runs-on: [self-hosted, Linux, X64, vertexcore]
    steps:
      - name: Move v1.1.1 to stable source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: 6a2a8f04f952d2b9dff76c0474d1589cacbb351e
        shell: bash
        run: |
          set -euo pipefail
          git init retag
          cd retag
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags origin "${TARGET_SHA}"
          git tag -f v1.1.1 "${TARGET_SHA}"
          git push origin refs/tags/v1.1.1 --force
